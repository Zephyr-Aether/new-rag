[project]
name = "agent-platform"
version = "0.1.0"
description = "Enterprise Agent Platform - MVP Phase 0+1 (runtime skeleton)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.31",
  "greenlet>=3.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "opentelemetry-exporter-otlp-proto-http>=1.26",
  "pyjwt>=2.9",
  "cryptography>=42",
  "pypdf>=5",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "olefile>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "alembic>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
