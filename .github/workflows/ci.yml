name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check app tests scripts alembic
      - name: Test
        run: .venv/bin/pytest -q
      - name: Chaos gate（§80：注入故障验证降级/恢复，失败即门禁红）
        run: .venv/bin/python scripts/chaos.py
      - name: Auth gate（§16/§27：auth_require_jwt=true 下无/无效 token 401、有效 200）
        run: .venv/bin/python scripts/smoke_auth.py
