services:
  # 官方推荐拓扑：pgvector（PostgreSQL + pgvector 扩展）是唯一数据库，无需额外 postgres 实例。
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5433:5432"
    volumes:
      - pgvectordata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://agent:agent@pgvector:5432/agent
      APP_REDIS_URL: redis://redis:6379/0
      # prod 触发 Phase 0 安全门禁：必须强随机 JWT secret（compose 会强制要求）
      APP_ENVIRONMENT: prod
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:?请在 .env 设置强随机 APP_AUTH_JWT_SECRET}
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY:-}
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-mock}
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-mock-model}
      APP_SEED_TENANT: ${APP_SEED_TENANT:-tenant-default}
      APP_SEED_USER: ${APP_SEED_USER:-user-default}
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 绑定真实域名时设 DOMAIN=agent.example.com（Caddy 自动 Let's Encrypt）；本地默认 http://localhost
      DOMAIN: ${DOMAIN:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgvectordata:
  miniodata:
  caddydata:
  caddyconfig:
